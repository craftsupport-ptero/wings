# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "release/v1.11.13" ]
  pull_request:
    branches: [ "release/v1.11.13" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22' # This version supports 'slices' and 'cmp'

    - name: Build application
      # This command builds your application and outputs a binary named 'your-app-name'.
      # - If your main package (where main.go is) is in the root directory, use '.'
      #   Example: go build -v -o your-app-name .
      # - If your main package is in a subdirectory (e.g., ./cmd/mycoolapp/), use that path.
      #   Example: go build -v -o your-app-name ./cmd/mycoolapp
      #
      # Replace 'your-app-name' with the desired name for your binary.
      run: go build -v -o wings .

    - name: Test
      run: go test -v ./...

    - name: Upload application binary
      uses: actions/upload-artifact@v4
      with:
        name: wings-linux-amd64
        # Path to the binary file you want to upload.
        # This must match the output file name from the 'go build' command.
        path: ./wings
        # Optional: Only upload the artifact for pushes to the release branch,
        # not for pull request builds.
